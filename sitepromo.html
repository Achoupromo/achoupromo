<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Promoções do Dia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #e60000;
    }

    .filter-buttons {
      text-align: center;
      margin: 20px 0;
    }

    .filter-buttons button {
      background-color: #e60000;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    .filter-buttons button:hover {
      background-color: #c40000;
    }

    .section-title {
      margin-top: 40px;
      font-size: 1.5em;
      color: #333;
      text-align: center;
    }

    .promo-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .promo {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .promo:hover {
      transform: scale(1.02);
    }

    .promo img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .promo h2 {
      font-size: 1.1em;
      margin: 10px 0;
      color: #333;
    }

    .promo .price {
      font-weight: bold;
      color: #008000;
    }

    .promo a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: white;
      background-color: #e60000;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
    }

    .promo a:hover {
      background-color: #c40000;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>🔥 Promoções do Dia</h1>

  <div class="section-title">⭐ Destaques do Dia</div>
  <div class="promo-container">
    <div class="promo destaque">
      <img src="https://via.placeholder.com/300x200" alt="Produto Destaque 1">
      <h2>Smartphone Top</h2>
      <p class="price">R$ 1.299,00</p>
      <a href="https://linkdoproduto.com" target="_blank">Ver oferta</a>
    </div>
    <div class="promo destaque">
      <img src="https://via.placeholder.com/300x200" alt="Produto Destaque 2">
      <h2>Fritadeira sem óleo</h2>
      <p class="price">R$ 299,90</p>
      <a href="https://linkdoproduto.com" target="_blank">Ver oferta</a>
    </div>
  </div>

  <div class="section-title">🎯 Filtrar por categoria</div>
  <div class="filter-buttons">
    <button onclick="filterPromos('todas')">Todas</button>
    <button onclick="filterPromos('eletronicos')">Eletrônicos</button>
    <button onclick="filterPromos('casa')">Casa</button>
    <button onclick="filterPromos('moda')">Moda</button>
  </div>

  <div class="promo-container" id="promo-list">
    <div class="promo eletronicos">
      <img src="https://via.placeholder.com/300x200" alt="Produto 1">
      <h2>Fone Bluetooth</h2>
      <p class="price">R$ 89,90</p>
      <a href="https://linkdoproduto.com" target="_blank">Ver oferta</a>
    </div>
    <div class="promo casa">
      <img src="https://via.placeholder.com/300x200" alt="Produto 2">
      <h2>Liquidificador Turbo</h2>
      <p class="price">R$ 149,00</p>
      <a href="https://linkdoproduto.com" target="_blank">Ver oferta</a>
    </div>
    <div class="promo moda">
      <img src="https://via.placeholder.com/300x200" alt="Produto 3">
      <h2>Tênis Esportivo</h2>
      <p class="price">R$ 199,90</p>
      <a href="https://linkdoproduto.com" target="_blank">Ver oferta</a>
    </div>
    <!-- Adicione mais produtos com as classes corretas -->
  </div>

  <script>
    function filterPromos(categoria) {
      const allPromos = document.querySelectorAll("#promo-list .promo");
      allPromos.forEach(promo => {
        if (categoria === 'todas') {
          promo.classList.remove('hidden');
        } else {
          promo.classList.toggle('hidden', !promo.classList.contains(categoria));
        }
      });
    }
  </script>

</body>
</html>
